<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Logo Anahtarlık Fabrikası</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/SVGLoader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/exporters/STLExporter.js"></script>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #f0f2f5; margin: 0; padding: 20px; display: flex; justify-content: center; }
        .container { background: white; padding: 25px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); width: 480px; box-sizing: border-box; }
        h2 { color: #333; margin-top: 0; text-align: center; font-size: 20px; }
        .form-group { margin-bottom: 12px; display: flex; justify-content: space-between; align-items: center; }
        label { font-weight: 600; color: #555; font-size: 14px; }
        select, input[type="file"], input[type="number"] { width: 180px; padding: 6px 10px; box-sizing: border-box; border: 1px solid #ddd; border-radius: 6px; font-size: 14px; text-align: right; }
        select { text-align-last: right; }
        .full-width { width: 100%; display: block; margin-bottom: 8px; }
        #canvas-container { width: 100%; height: 240px; background: #e9ecef; border-radius: 8px; margin: 15px 0; position: relative; overflow: hidden; cursor: grab; }
        #canvas-container:active { cursor: grabbing; }
        button { background: #28a745; color: white; border: none; padding: 12px; width: 100%; border-radius: 6px; font-size: 16px; font-weight: bold; cursor: pointer; transition: background 0.2s; }
        button:hover { background: #218838; }
        hr { border: 0; border-top: 1px solid #eee; margin: 15px 0; }
        .status { font-size: 11px; color: #007bff; text-align: center; font-weight: bold; margin-bottom: 10px; }
        .file-info { font-size: 12px; color: #666; margin-top: 4px; }
    </style>
</head>
<body>

<div class="container">
    <h2>3D Logo Anahtarlık Fabrikası</h2>
    
    <div class="form-group full-width" style="flex-direction: column; align-items: flex-start;">
        <label for="logoSelect">Hazır Logo Seç:</label>
        <select id="logoSelect" onchange="loadPresetLogo()" style="width: 100%; text-align: left;">
            <option value="tesla">Tesla Logo</option>
            <option value="bmw">BMW Logo</option>
            <option value="ford">Ford Logo</option>
            <option value="audi">Audi Logo</option>
            <option value="mercedes">Mercedes Logo</option>
        </select>
    </div>

    <div class="form-group full-width" style="flex-direction: column; align-items: flex-start; margin-top: 10px;">
        <label for="svgUpload">Veya Kendi SVG Logonuzu Yükleyin:</label>
        <input type="file" id="svgUpload" accept=".svg" onchange="handleSvgUpload(event)" style="width: 100%;">
        <div class="file-info">(.svg vektör dosyanızı seçin)</div>
    </div>

    <div id="status" class="status">Logo yükleniyor...</div>

    <hr>

    <div class="form-group">
        <label for="widthInput">Genişlik (X - mm):</label>
        <input type="number" id="widthInput" value="70" min="40" max="150" oninput="rebuildModel()">
    </div>
    <div class="form-group">
        <label for="heightInput">Yükseklik (Y - mm):</label>
        <input type="number" id="heightInput" value="50" min="30" max="100" oninput="rebuildModel()">
    </div>
    <div class="form-group">
        <label for="thicknessInput">Kalınlık (Z - mm):</label>
        <input type="number" id="thicknessInput" value="3.5" min="1" max="10" step="0.5" oninput="rebuildModel()">
    </div>
    <div class="form-group">
        <label for="holeInput">Delik Çapı (mm):</label>
        <input type="number" id="holeInput" value="4.5" min="2" max="10" step="0.5" oninput="rebuildModel()">
    </div>

    <div id="canvas-container"></div>

    <button onclick="downloadSTL()">Logo STL İndir</button>
</div>

<script>
    let scene, camera, renderer, controls, keychainGroup;
    let currentSvgShapes = null;
    let currentLogoName = "tesla";

    const presetLogos = {
        tesla: '<?xml version="1.0" encoding="UTF-8"?><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300"><path d="M150 40 C150 40 175 75 210 85 C175 95 150 160 150 230 C150 160 125 95 90 85 C125 75 150 40 150 40 Z" fill="#fff"/><path d="M75 50 L225 50 L225 65 L75 65 Z" fill="#fff"/></svg>',
        bmw: '<?xml version="1.0" encoding="UTF-8"?><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300"><circle cx="150" cy="150" r="110" fill="none" stroke="#fff" stroke-width="16"/><path d="M150 40 A110 110 0 0 1 260 150 L150 150 Z" fill="#fff"/><path d="M150 260 A110 110 0 0 1 40 150 L150 150 Z" fill="#fff"/></svg>',
        ford: '<?xml version="1.0" encoding="UTF-8"?><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 150"><ellipse cx="150" cy="75" rx="125" ry="52" fill="none" stroke="#fff" stroke-width="10"/><path d="M90 85 C100 65 115 60 130 65 C140 70 140 85 130 90 C115 95 105 80 110 75" fill="none" stroke="#fff" stroke-width="8"/></svg>',
        audi: '<?xml version="1.0" encoding="UTF-8"?><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 150"><circle cx="85" cy="75" r="45" fill="none" stroke="#fff" stroke-width="12"/><circle cx="155" cy="75" r="45" fill="none" stroke="#fff" stroke-width="12"/><circle cx="225" cy="75" r="45" fill="none" stroke="#fff" stroke-width="12"/><circle cx="295" cy="75" r="45" fill="none" stroke="#fff" stroke-width="12"/></svg>',
        mercedes: '<?xml version="1.0" encoding="UTF-8"?><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300"><circle cx="150" cy="150" r="115" fill="none" stroke="#fff" stroke-width="14"/><polygon points="150,45 163,150 235,200 220,212 150,162 80,212 65,200 137,150" fill="#fff"/></svg>'
    };

    function init3D() {
        const container = document.getElementById('canvas-container');
        scene = new THREE.Scene();
        scene.background = new THREE.Color(0xe9ecef);

        camera = new THREE.PerspectiveCamera(45, container.clientWidth / container.clientHeight, 0.1, 1000);
        camera.position.set(0, -130, 80);
        camera.up.set(0, 0, 1);
        camera.lookAt(0, 0, 0);

        renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(container.clientWidth, container.clientHeight);
        container.appendChild(renderer.domElement);

        controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;

        scene.add(new THREE.AmbientLight(0xffffff, 0.7));
        const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
        dirLight.position.set(10, -20, 50);
        scene.add(dirLight);

        loadPresetLogo();
        animate();
    }

    function loadPresetLogo() {
        currentLogoName = document.getElementById('logoSelect').value;
        const svgString = presetLogos[currentLogoName];
        parseAndBuild(svgString);
    }

    function handleSvgUpload(event) {
        const file = event.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = function(e) {
            currentLogoName = file.name.replace(/\.[^/.]+$/, "");
            parseAndBuild(e.target.result);
        };
        reader.readAsText(file);
    }

    function parseAndBuild(svgText) {
        document.getElementById('status').innerText = "Logo işleniyor...";
        try {
            const loader = new THREE.SVGLoader();
            const svgData = loader.parse(svgText);
            currentSvgShapes = svgData.paths;
            document.getElementById('status').innerText = "Logo başarıyla yüklendi!";
            rebuildModel();
        } catch (e) {
            document.getElementById('status').innerText = "SVG yükleme hatası!";
            console.error(e);
        }
    }

    function rebuildModel() {
        if (!scene || !currentSvgShapes) return;
        if (keychainGroup) scene.remove(keychainGroup);

        keychainGroup = new THREE.Group();
        const plateMaterial = new THREE.MeshStandardMaterial({ color: 0x111111, roughness: 0.3 });
        const logoMaterial = new THREE.MeshStandardMaterial({ color: 0x00a8cc, roughness: 0.2 });

        const width = parseFloat(document.getElementById('widthInput').value) || 70;
        const height = parseFloat(document.getElementById('heightInput').value) || 50;
        const thickness = parseFloat(document.getElementById('thicknessInput').value) || 3.5;
        const holeDia = parseFloat(document.getElementById('holeInput').value) || 4.5;

        const rectShape = new THREE.Shape();
        const hw = width / 2;
        const hh = height / 2;
        const r = 5;

        rectShape.moveTo(-hw + r, -hh);
        rectShape.lineTo(hw - r, -hh);
        rectShape.quadraticCurveTo(hw, -hh, hw, -hh + r);
        rectShape.lineTo(hw, hh - r - 8);
        rectShape.quadraticCurveTo(hw, hh - 8, hw - r, hh - 8);
        rectShape.lineTo(-hw + r, hh - 8);
        rectShape.quadraticCurveTo(-hw, hh - 8, -hw, hh - 8 - r);
        rectShape.lineTo(-hw, -hh + r);
        rectShape.quadraticCurveTo(-hw, -hh, -hw + r, -hh);

        const bossX = 0;
        const bossY = hh - 4;
        const holePath = new THREE.Path();
        holePath.absarc(bossX, bossY, holeDia / 2, 0, Math.PI * 2, true);
        rectShape.holes.push(holePath);

        const bossShape = new THREE.Shape();
        bossShape.absarc(bossX, bossY, (holeDia / 2) + 3, 0, Math.PI * 2, false);
        bossShape.holes.push(holePath);

        const extrudeSettings = { depth: thickness, bevelEnabled: true, bevelSegments: 2, steps: 1, bevelSize: 0.15, bevelThickness: 0.15 };
        
        const plateGeo = new THREE.ExtrudeGeometry([rectShape, bossShape], extrudeSettings);
        plateGeo.center();
        const plateMesh = new THREE.Mesh(plateGeo, plateMaterial);
        plateMesh.position.set(0, 0, thickness / 2);
        keychainGroup.add(plateMesh);

        const logoGroup = new THREE.Group();
        currentSvgShapes.forEach(path => {
            const shapes = path.toShapes(true);
            shapes.forEach(shape => {
                const geom = new THREE.ExtrudeGeometry(shape, { depth: 1.2, bevelEnabled: false });
                const mesh = new THREE.Mesh(geom, logoMaterial);
                logoGroup.add(mesh);
            });
        });

        const box = new THREE.Box3().setFromObject(logoGroup);
        const size = new THREE.Vector3();
        box.getSize(size);
        
        const maxW = width - 16;
        const maxH = height - 22;
        const scale = Math.min(maxW / (size.x || 1), maxH / (size.y || 1));
        
        logoGroup.scale.set(scale, -scale, 1);
        logoGroup.position.set(- (size.x * scale) / 2, (size.y * scale) / 2 - 2, thickness);

        keychainGroup.add(logoGroup);
        scene.add(keychainGroup);
    }

    function animate() {
        requestAnimationFrame(animate);
        controls.update();
        renderer.render(scene, camera);
    }

    function downloadSTL() {
        if (!keychainGroup) {
            alert("Model henüz yüklenmedi!");
            return;
        }

        const exporter = new THREE.STLExporter();
        const result = exporter.parse(keychainGroup, { binary: true });

        const blob = new Blob([result], { type: 'application/octet-stream' });
        const link = document.createElement('a');
        link.href = URL.createObjectURL(blob);
        link.download = `${currentLogoName}_logo_anahtarlik.stl`;
        link.click();
    }

    window.onload = init3D;
</script>

</body>
</html>
