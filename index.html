<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Orijinal Logolar - Anahtarlık Fabrikası</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/SVGLoader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/exporters/STLExporter.js"></script>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #f0f2f5; margin: 0; padding: 20px; display: flex; justify-content: center; }
        .container { background: white; padding: 25px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); width: 480px; box-sizing: border-box; }
        h2 { color: #333; margin-top: 0; text-align: center; font-size: 20px; }
        .form-group { margin-bottom: 12px; display: flex; justify-content: space-between; align-items: center; }
        label { font-weight: 600; color: #555; font-size: 14px; }
        select, input[type="file"], input[type="number"] { width: 180px; padding: 6px 10px; box-sizing: border-box; border: 1px solid #ddd; border-radius: 6px; font-size: 14px; text-align: right; }
        select { text-align-last: right; }
        .full-width { width: 100%; display: block; margin-bottom: 8px; }
        #canvas-container { width: 100%; height: 240px; background: #e9ecef; border-radius: 8px; margin: 15px 0; position: relative; overflow: hidden; cursor: grab; }
        #canvas-container:active { cursor: grabbing; }
        button { background: #28a745; color: white; border: none; padding: 12px; width: 100%; border-radius: 6px; font-size: 16px; font-weight: bold; cursor: pointer; transition: background 0.2s; }
        button:hover { background: #218838; }
        hr { border: 0; border-top: 1px solid #eee; margin: 15px 0; }
        .status { font-size: 11px; color: #007bff; text-align: center; font-weight: bold; margin-bottom: 10px; }
        .file-info { font-size: 12px; color: #666; margin-top: 4px; }
    </style>
</head>
<body>

<div class="container">
    <h2>3D Orijinal Logolar - Anahtarlık Fabrikası</h2>
    
    <div class="form-group full-width" style="flex-direction: column; align-items: flex-start;">
        <label for="logoSelect">Tüm Markalar (20 Orijinal Logo):</label>
        <select id="logoSelect" onchange="loadPresetLogo()" style="width: 100%; text-align: left; font-weight: bold;"></select>
    </div>

    <div class="form-group full-width" style="flex-direction: column; align-items: flex-start; margin-top: 10px;">
        <label for="svgUpload">Veya Özel SVG Logonuzu Yükleyin:</label>
        <input type="file" id="svgUpload" accept=".svg" onchange="handleSvgUpload(event)" style="width: 100%;">
    </div>

    <div id="status" class="status">Sistem aktif ve hazır!</div>
    <hr>
    <div class="form-group"><label>Genişlik (X - mm):</label><input type="number" id="widthInput" value="60" min="30" max="150" oninput="build3D()"></div>
    <div class="form-group"><label>Yükseklik (Y - mm):</label><input type="number" id="heightInput" value="60" min="30" max="100" oninput="build3D()"></div>
    <div class="form-group"><label>Kalınlık (Z - mm):</label><input type="number" id="thicknessInput" value="3.5" min="1" max="10" step="0.5" oninput="build3D()"></div>
    <div class="form-group"><label>Delik Çapı (mm):</label><input type="number" id="holeInput" value="4.5" min="2" max="10" step="0.5" oninput="build3D()"></div>

    <div id="canvas-container"></div>
    <button onclick="downloadSTL()">Logo STL İndir</button>
</div>

<script>
    let scene, camera, renderer, controls, keychainGroup;
    let currentSvgPaths = null; 

    // Orijinal CDN Vektörleri ve Özel Taban Plakası Formları
    const BRANDS = {
        tesla: { name: "Tesla", base: 'rect', url: "https://cdn.jsdelivr.net/npm/simple-icons@v11/icons/tesla.svg" },
        bmw: { name: "BMW", base: 'circle', url: "https://cdn.jsdelivr.net/npm/simple-icons@v11/icons/bmw.svg" },
        ford: { name: "Ford", base: 'oval', url: "https://cdn.jsdelivr.net/npm/simple-icons@v11/icons/ford.svg" },
        audi: { name: "Audi", base: 'rect', url: "https://cdn.jsdelivr.net/npm/simple-icons@v11/icons/audi.svg" },
        mercedes: { name: "Mercedes", base: 'circle', url: "https://cdn.jsdelivr.net/npm/simple-icons@v11/icons/mercedes.svg" },
        opel: { name: "Opel", base: 'circle', url: "https://cdn.jsdelivr.net/npm/simple-icons@v11/icons/opel.svg" },
        renault: { name: "Renault", base: 'diamond', url: "https://cdn.jsdelivr.net/npm/simple-icons@v11/icons/renault.svg" },
        fiat: { name: "Fiat", base: 'circle', url: "https://cdn.jsdelivr.net/npm/simple-icons@v11/icons/fiat.svg" },
        honda: { name: "Honda", base: 'rect', url: "https://cdn.jsdelivr.net/npm/simple-icons@v11/icons/honda.svg" },
        hyundai: { name: "Hyundai", base: 'oval', url: "https://cdn.jsdelivr.net/npm/simple-icons@v11/icons/hyundai.svg" },
        vw: { name: "VW", base: 'circle', url: "https://cdn.jsdelivr.net/npm/simple-icons@v11/icons/volkswagen.svg" },
        citroen: { name: "Citroen", base: 'circle', url: "https://cdn.jsdelivr.net/npm/simple-icons@v11/icons/citroen.svg" },
        suzuki: { name: "Suzuki", base: 'diamond', url: "https://cdn.jsdelivr.net/npm/simple-icons@v11/icons/suzuki.svg" },
        peugeot: { name: "Peugeot", base: 'shield', url: "https://cdn.jsdelivr.net/npm/simple-icons@v11/icons/peugeot.svg" },
        toyota: { name: "Toyota", base: 'oval', url: "https://cdn.jsdelivr.net/npm/simple-icons@v11/icons/toyota.svg" },
        skoda: { name: "Skoda", base: 'circle', url: "https://cdn.jsdelivr.net/npm/simple-icons@v11/icons/skoda.svg" },
        nissan: { name: "Nissan", base: 'circle', url: "https://cdn.jsdelivr.net/npm/simple-icons@v11/icons/nissan.svg" },
        mitsubishi: { name: "Mitsubishi", base: 'rect', url: "https://cdn.jsdelivr.net/npm/simple-icons@v11/icons/mitsubishi.svg" },
        mini: { name: "Mini", base: 'circle', url: "https://cdn.jsdelivr.net/npm/simple-icons@v11/icons/mini.svg" },
        volvo: { name: "Volvo", base: 'circle', url: "https://cdn.jsdelivr.net/npm/simple-icons@v11/icons/volvo.svg" }
    };

    function init3D() {
        const container = document.getElementById('canvas-container');
        scene = new THREE.Scene();
        scene.background = new THREE.Color(0xe9ecef);

        camera = new THREE.PerspectiveCamera(45, container.clientWidth / container.clientHeight, 0.1, 1000);
        camera.position.set(0, -130, 80);
        camera.up.set(0, 0, 1);
        camera.lookAt(0, 0, 0);

        renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(container.clientWidth, container.clientHeight);
        container.appendChild(renderer.domElement);

        controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;

        scene.add(new THREE.AmbientLight(0xffffff, 0.7));
        const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
        dirLight.position.set(10, -20, 50);
        scene.add(dirLight);

        const sel = document.getElementById('logoSelect');
        Object.keys(BRANDS).forEach(k => {
            let opt = document.createElement('option');
            opt.value = k; opt.innerText = BRANDS[k].name;
            sel.appendChild(opt);
        });

        loadPresetLogo();
        animate();
    }

    function loadPresetLogo() {
        document.getElementById('svgUpload').value = ""; 
        const brand = BRANDS[document.getElementById('logoSelect').value];
        document.getElementById('status').innerText = "Orijinal logo CDN'den indiriliyor...";
        document.getElementById('status').style.color = "#ffc107";

        const loader = new THREE.SVGLoader();
        loader.load(brand.url, function (svgData) {
            currentSvgPaths = svgData.paths;
            document.getElementById('status').innerText = "Orijinal Logo Hazır!";
            document.getElementById('status').style.color = "#28a745";
            build3D();
        }, undefined, function (error) {
            document.getElementById('status').innerText = "Bağlantı Hatası: Logo indirilemedi!";
            document.getElementById('status').style.color = "red";
        });
    }

    function handleSvgUpload(event) {
        const file = event.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = function(e) {
            try {
                const loader = new THREE.SVGLoader();
                currentSvgPaths = loader.parse(e.target.result).paths;
                document.getElementById('status').innerText = "Özel SVG başarıyla yüklendi!";
                document.getElementById('status').style.color = "#007bff";
                build3D();
            } catch (err) {
                document.getElementById('status').innerText = "SVG okuma hatası!";
                document.getElementById('status').style.color = "red";
            }
        };
        reader.readAsText(file);
    }

    // Taban Plakası Şekil Üretici (Yuvarlak, Oval, Kalkan, Elmas, Dikdörtgen)
    function getBaseShape(type, w, h) {
        const s = new THREE.Shape();
        const hw = w / 2, hh = h / 2;
        if (type === 'circle') {
            s.absarc(0, 0, Math.min(hw, hh), 0, Math.PI * 2);
        } else if (type === 'oval') {
            s.absellipse(0, 0, hw, hh, 0, Math.PI * 2);
        } else if (type === 'diamond') {
            s.moveTo(0, hh); s.lineTo(hw, 0); s.lineTo(0, -hh); s.lineTo(-hw, 0); s.lineTo(0, hh);
        } else if (type === 'shield') {
            s.moveTo(-hw, hh); s.lineTo(hw, hh);
            s.quadraticCurveTo(hw, -hh * 0.2, 0, -hh);
            s.quadraticCurveTo(-hw, -hh * 0.2, -hw, hh);
        } else { // Rect (Yuvarlatılmış Dikdörtgen)
            const r = 5;
            s.moveTo(-hw + r, -hh); s.lineTo(hw - r, -hh); s.quadraticCurveTo(hw, -hh, hw, -hh + r);
            s.lineTo(hw, hh - r); s.quadraticCurveTo(hw, hh, hw - r, hh);
            s.lineTo(-hw + r, hh); s.quadraticCurveTo(-hw, hh, -hw, hh - r);
            s.lineTo(-hw, -hh + r); s.quadraticCurveTo(-hw, -hh, -hw + r, -hh);
        }
        return s;
    }

    function build3D() {
        if (!scene || !currentSvgPaths) return;
        if (keychainGroup) scene.remove(keychainGroup);

        keychainGroup = new THREE.Group();
        const matBase = new THREE.MeshStandardMaterial({ color: 0x333333, roughness: 0.3 });
        const matLogo = new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.2 });

        const width = parseFloat(document.getElementById('widthInput').value) || 70;
        const height = parseFloat(document.getElementById('heightInput').value) || 50;
        const thickness = parseFloat(document.getElementById('thicknessInput').value) || 3.5;
        const holeDia = parseFloat(document.getElementById('holeInput').value) || 4.5;
        const extrudeSettings = { depth: thickness, bevelEnabled: true, bevelSegments: 2, steps: 1, bevelSize: 0.1, bevelThickness: 0.1 };
        
        const isCustom = document.getElementById('svgUpload').files.length > 0;
        const baseType = isCustom ? 'rect' : BRANDS[document.getElementById('logoSelect').value].base;

        // 1. Taban Plakası
        const baseShape = getBaseShape(baseType, width, height);
        const baseGeo = new THREE.ExtrudeGeometry(baseShape, extrudeSettings);
        baseGeo.center();
        const baseMesh = new THREE.Mesh(baseGeo, matBase);
        keychainGroup.add(baseMesh);

        // 2. Dinamik Halka Bağlantısı (Plakanın üst sınırını otomatik bularak asılı kalmayı önler)
        const boxBase = new THREE.Box3().setFromObject(baseMesh);
        const maxY = boxBase.max.y;
        
        const bossRadius = (holeDia / 2) + 3;
        const bossShape = new THREE.Shape();
        bossShape.absarc(0, 0, bossRadius, 0, Math.PI * 2, false);
        const holePath = new THREE.Path();
        holePath.absarc(0, 0, holeDia / 2, 0, Math.PI * 2, true);
        bossShape.holes.push(holePath);

        const bossGeo = new THREE.ExtrudeGeometry(bossShape, extrudeSettings);
        const bossMesh = new THREE.Mesh(bossGeo, matBase);
        bossMesh.position.set(0, maxY + bossRadius - 1.5, 0); // Üst kenara tam kaynatma
        keychainGroup.add(bossMesh);

        // 3. CDN'den İndirilen Orijinal Logoyu Ekleme ve Ortalama
        const logoGroup = new THREE.Group();
        currentSvgPaths.forEach(path => {
            path.toShapes(true).forEach(shape => {
                const geom = new THREE.ExtrudeGeometry(shape, { depth: 1.2, bevelEnabled: false });
                logoGroup.add(new THREE.Mesh(geom, matLogo));
            });
        });
        
        // Logoyu merkeze çekme ve plaka boyutuna göre ölçeklendirme
        const lBox = new THREE.Box3().setFromObject(logoGroup);
        const size = new THREE.Vector3(); lBox.getSize(size);
        const center = new THREE.Vector3(); lBox.getCenter(center);
        
        logoGroup.children.forEach(m => { m.geometry.translate(-center.x, -center.y, 0); });
        
        const scale = Math.min((width - 12) / (size.x || 1), (height - 12) / (size.y || 1));
        logoGroup.scale.set(scale, -scale, 1); // SVG Y ekseni ters çevrilir
        logoGroup.position.set(0, 0, thickness / 2); // Plaka yüzeyine oturtulur

        keychainGroup.add(logoGroup);
        scene.add(keychainGroup);
    }

    function animate() {
        requestAnimationFrame(animate);
        controls.update();
        renderer.render(scene, camera);
    }

    function downloadSTL() {
        if (!keychainGroup) { alert("Model henüz yüklenmedi!"); return; }
        const exporter = new THREE.STLExporter();
        const result = exporter.parse(keychainGroup, { binary: true });
        const blob = new Blob([result], { type: 'application/octet-stream' });
        const link = document.createElement('a');
        link.href = URL.createObjectURL(blob);
        link.download = `3d_orijinal_logo_anahtarlik.stl`;
        link.click();
    }

    window.onload = init3D;
</script>

</body>
</html>
