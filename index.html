<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Logo Anahtarlık Fabrikası</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/SVGLoader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/exporters/STLExporter.js"></script>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #f0f2f5; margin: 0; padding: 20px; display: flex; justify-content: center; }
        .container { background: white; padding: 25px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); width: 480px; box-sizing: border-box; }
        h2 { color: #333; margin-top: 0; text-align: center; font-size: 20px; }
        .form-group { margin-bottom: 12px; display: flex; justify-content: space-between; align-items: center; }
        label { font-weight: 600; color: #555; font-size: 14px; }
        select, input[type="file"], input[type="number"] { width: 180px; padding: 6px 10px; box-sizing: border-box; border: 1px solid #ddd; border-radius: 6px; font-size: 14px; text-align: right; }
        select { text-align-last: right; }
        .full-width { width: 100%; display: block; margin-bottom: 8px; }
        #canvas-container { width: 100%; height: 240px; background: #e9ecef; border-radius: 8px; margin: 15px 0; position: relative; overflow: hidden; cursor: grab; }
        #canvas-container:active { cursor: grabbing; }
        button { background: #28a745; color: white; border: none; padding: 12px; width: 100%; border-radius: 6px; font-size: 16px; font-weight: bold; cursor: pointer; transition: background 0.2s; }
        button:hover { background: #218838; }
        hr { border: 0; border-top: 1px solid #eee; margin: 15px 0; }
        .status { font-size: 11px; color: #007bff; text-align: center; font-weight: bold; margin-bottom: 10px; }
        .file-info { font-size: 12px; color: #666; margin-top: 4px; }
    </style>
</head>
<body>

<div class="container">
    <h2>3D Logo Anahtarlık Fabrikası</h2>
    
    <div class="form-group full-width" style="flex-direction: column; align-items: flex-start;">
        <label for="logoSelect">Hazır Logo Seç:</label>
        <select id="logoSelect" onchange="onLogoChange()" style="width: 100%; text-align: left;">
            <option value="tesla">Tesla Logo</option>
            <option value="bmw">BMW Logo</option>
            <option value="ford">Ford Logo</option>
            <option value="audi">Audi Logo</option>
            <option value="mercedes">Mercedes Logo</option>
        </select>
    </div>

    <div class="form-group full-width" style="flex-direction: column; align-items: flex-start; margin-top: 10px;">
        <label for="svgUpload">Veya Kendi SVG Logonuzu Yükleyin:</label>
        <input type="file" id="svgUpload" accept=".svg" onchange="handleSvgUpload(event)" style="width: 100%;">
        <div class="file-info">(.svg vektör dosyanızı seçin)</div>
    </div>

    <div id="status" class="status">Sistem aktif ve hazır!</div>

    <hr>

    <div class="form-group">
        <label for="widthInput">Genişlik (X - mm):</label>
        <input type="number" id="widthInput" value="70" min="40" max="150" oninput="safeUpdate()">
    </div>
    <div class="form-group">
        <label for="heightInput">Yükseklik (Y - mm):</label>
        <input type="number" id="heightInput" value="50" min="30" max="100" oninput="safeUpdate()">
    </div>
    <div class="form-group">
        <label for="thicknessInput">Kalınlık (Z - mm):</label>
        <input type="number" id="thicknessInput" value="3.5" min="1" max="10" step="0.5" oninput="safeUpdate()">
    </div>
    <div class="form-group">
        <label for="holeInput">Delik Çapı (mm):</label>
        <input type="number" id="holeInput" value="4.5" min="2" max="10" step="0.5" oninput="safeUpdate()">
    </div>

    <div id="canvas-container"></div>

    <button onclick="downloadSTL()">Logo STL İndir</button>
</div>

<script>
    let scene, camera, renderer, controls, keychainGroup;
    let activeMode = 'preset'; 
    let customSvgShapes = null;

    function init3D() {
        const container = document.getElementById('canvas-container');
        scene = new THREE.Scene();
        scene.background = new THREE.Color(0xe9ecef);

        camera = new THREE.PerspectiveCamera(45, container.clientWidth / container.clientHeight, 0.1, 1000);
        camera.position.set(0, -130, 80);
        camera.up.set(0, 0, 1);
        camera.lookAt(0, 0, 0);

        renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(container.clientWidth, container.clientHeight);
        container.appendChild(renderer.domElement);

        controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;

        scene.add(new THREE.AmbientLight(0xffffff, 0.7));
        const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
        dirLight.position.set(10, -20, 50);
        scene.add(dirLight);

        safeUpdate();
        animate();
    }

    function onLogoChange() {
        activeMode = 'preset';
        document.getElementById('svgUpload').value = ""; 
        document.getElementById('status').innerText = "Hazır logo yüklendi!";
        document.getElementById('status').style.color = "#28a745";
        safeUpdate();
    }

    function safeUpdate() {
        try {
            updateKeychain();
        } catch (e) {
            console.error("Çizim Hatası: ", e);
            document.getElementById('status').innerText = "Çizim hatası, parametreleri kontrol edin.";
            document.getElementById('status').style.color = "red";
        }
    }

    function createLogoGeometry(logoType) {
        const group = new THREE.Group();
        const mat = new THREE.MeshStandardMaterial({ color: 0x00a8cc, roughness: 0.2 });

        function addMesh(shape, depth = 1.2) {
            const geom = new THREE.ExtrudeGeometry(shape, { depth: depth, bevelEnabled: false });
            group.add(new THREE.Mesh(geom, mat));
        }

        if (logoType === 'tesla') {
            const path1 = new THREE.Shape();
            path1.moveTo(0, 18);
            path1.bezierCurveTo(8, 12, 18, 2, 28, -5);
            path1.bezierCurveTo(15, -2, 5, -12, 0, -22);
            path1.bezierCurveTo(-5, -12, -15, -2, -28, -5);
            path1.bezierCurveTo(-18, 2, -8, 12, 0, 18);
            addMesh(path1);

            const bar = new THREE.Shape();
            bar.moveTo(-25, 14); bar.lineTo(25, 14); bar.lineTo(25, 18); bar.lineTo(-25, 18); bar.lineTo(-25, 14);
            addMesh(bar);
        } 
        else if (logoType === 'bmw') {
            const ring = new THREE.Shape();
            ring.absarc(0, 0, 22, 0, Math.PI * 2, false);
            const hole = new THREE.Path();
            hole.absarc(0, 0, 18, 0, Math.PI * 2, true);
            ring.holes.push(hole);
            addMesh(ring);

            const lineH = new THREE.Shape();
            lineH.moveTo(-18, -1.5); lineH.lineTo(18, -1.5); lineH.lineTo(18, 1.5); lineH.lineTo(-18, 1.5); lineH.lineTo(-18, -1.5);
            addMesh(lineH);

            const lineV = new THREE.Shape();
            lineV.moveTo(-1.5, -18); lineV.lineTo(1.5, -18); lineV.lineTo(1.5, 18); lineV.lineTo(-1.5, 18); lineV.lineTo(-1.5, -18);
            addMesh(lineV);
        } 
        else if (logoType === 'ford') {
            const oval = new THREE.Shape();
            oval.absellipse(0, 0, 28, 14, 0, Math.PI * 2, false, 0);
            const ovalHole = new THREE.Path();
            ovalHole.absellipse(0, 0, 24, 10, 0, Math.PI * 2, true, 0);
            oval.holes.push(ovalHole);
            addMesh(oval);

            const innerBar = new THREE.Shape();
            innerBar.moveTo(-16, -3); innerBar.lineTo(16, -3); innerBar.lineTo(16, 3); innerBar.lineTo(-16, 3); innerBar.lineTo(-16, -3);
            addMesh(innerBar);
        } 
        else if (logoType === 'audi') {
            for (let i = -1.5; i <= 1.5; i += 1) {
                const ring = new THREE.Shape();
                ring.absarc(i * 11, 0, 9, 0, Math.PI * 2, false);
                const h = new THREE.Path();
                h.absarc(i * 11, 0, 6.5, 0, Math.PI * 2, true);
                ring.holes.push(h);
                addMesh(ring);
            }
        } 
        else if (logoType === 'mercedes') {
            const ring = new THREE.Shape();
            ring.absarc(0, 0, 21, 0, Math.PI * 2, false);
            const hole = new THREE.Path();
            hole.absarc(0, 0, 18, 0, Math.PI * 2, true);
            ring.holes.push(hole);
            addMesh(ring);

            for (let i = 0; i < 3; i++) {
                const angle = i * ((2 * Math.PI) / 3);
                const box = new THREE.Shape();
                box.moveTo(-1.5, 0); box.lineTo(1.5, 0); box.lineTo(1.5, 18); box.lineTo(-1.5, 18); box.lineTo(-1.5, 0);
                
                const geom = new THREE.ExtrudeGeometry(box, { depth: 1.2, bevelEnabled: false });
                const mesh = new THREE.Mesh(geom, mat);
                mesh.rotation.z = -angle; 
                group.add(mesh);
            }
        }
        return group;
    }

    function handleSvgUpload(event) {
        const file = event.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = function(e) {
            try {
                const loader = new THREE.SVGLoader();
                const svgData = loader.parse(e.target.result);
                customSvgShapes = svgData.paths;
                activeMode = 'custom';
                document.getElementById('status').innerText = "Özel SVG başarıyla yüklendi!";
                document.getElementById('status').style.color = "#007bff";
                safeUpdate();
            } catch (err) {
                document.getElementById('status').innerText = "SVG okuma hatası!";
                document.getElementById('status').style.color = "red";
            }
        };
        reader.readAsText(file);
    }

    function updateKeychain() {
        if (!scene) return;
        if (keychainGroup) scene.remove(keychainGroup);

        keychainGroup = new THREE.Group();
        const plateMaterial = new THREE.MeshStandardMaterial({ color: 0x333333, roughness: 0.3 });

        const width = parseFloat(document.getElementById('widthInput').value) || 70;
        const height = parseFloat(document.getElementById('heightInput').value) || 50;
        const thickness = parseFloat(document.getElementById('thicknessInput').value) || 3.5;
        const holeDia = parseFloat(document.getElementById('holeInput').value) || 4.5;
        const logoType = document.getElementById('logoSelect').value;

        // 1. Ana Plaka Geometrisi
        const rectShape = new THREE.Shape();
        const hw = width / 2;
        const hh = height / 2;
        const r = 5;

        rectShape.moveTo(-hw + r, -hh);
        rectShape.lineTo(hw - r, -hh);
        rectShape.quadraticCurveTo(hw, -hh, hw, -hh + r);
        rectShape.lineTo(hw, hh - r - 8);
        rectShape.quadraticCurveTo(hw, hh - 8, hw - r, hh - 8);
        rectShape.lineTo(-hw + r, hh - 8);
        rectShape.quadraticCurveTo(-hw, hh - 8, -hw, hh - 8 - r);
        rectShape.lineTo(-hw, -hh + r);
        rectShape.quadraticCurveTo(-hw, -hh, -hw + r, -hh);

        const bossX = 0;
        const bossY = hh - 4;
        const holePath1 = new THREE.Path();
        holePath1.absarc(bossX, bossY, holeDia / 2, 0, Math.PI * 2, true);
        rectShape.holes.push(holePath1);

        const extrudeSettings = { depth: thickness, bevelEnabled: true, bevelSegments: 2, steps: 1, bevelSize: 0.15, bevelThickness: 0.15 };
        const plateGeo = new THREE.ExtrudeGeometry(rectShape, extrudeSettings);
        plateGeo.center();
        const plateMesh = new THREE.Mesh(plateGeo, plateMaterial);
        plateMesh.position.set(0, 0, thickness / 2);
        keychainGroup.add(plateMesh);

        // 2. Halka Kulakçığı Geometrisi (Ayrı çizilerek çökme önlendi)
        const bossShape = new THREE.Shape();
        bossShape.absarc(bossX, bossY, (holeDia / 2) + 3, 0, Math.PI * 2, false);
        const holePath2 = new THREE.Path();
        holePath2.absarc(bossX, bossY, holeDia / 2, 0, Math.PI * 2, true);
        bossShape.holes.push(holePath2);

        const bossGeo = new THREE.ExtrudeGeometry(bossShape, extrudeSettings);
        const bossMesh = new THREE.Mesh(bossGeo, plateMaterial);
        bossMesh.position.set(0, 0, thickness / 2);
        
        // Kulakçığı plakaya ortalamak için pozisyon ofseti (plateGeo.center() işlemine uyum)
        bossMesh.position.x = bossX;
        bossMesh.position.y = bossY + 4; 
        keychainGroup.add(bossMesh);

        // 3. Logo Grubu
        let logoGroup;
        if (activeMode === 'custom' && customSvgShapes) {
            logoGroup = new THREE.Group();
            const customMat = new THREE.MeshStandardMaterial({ color: 0x00a8cc, roughness: 0.2 });
            customSvgShapes.forEach(path => {
                const shapes = path.toShapes(true);
                shapes.forEach(shape => {
                    const geom = new THREE.ExtrudeGeometry(shape, { depth: 1.2, bevelEnabled: false });
                    logoGroup.add(new THREE.Mesh(geom, customMat));
                });
            });
            const box = new THREE.Box3().setFromObject(logoGroup);
            const size = new THREE.Vector3();
            box.getSize(size);
            const scale = Math.min((width - 16) / (size.x || 1), (height - 22) / (size.y || 1));
            logoGroup.scale.set(scale, -scale, 1);
            logoGroup.position.set(- (size.x * scale) / 2, (size.y * scale) / 2 - 2, thickness);
        } else {
            logoGroup = createLogoGeometry(logoType);
            logoGroup.position.set(0, -2, thickness);
        }

        keychainGroup.add(logoGroup);
        scene.add(keychainGroup);
    }

    function animate() {
        requestAnimationFrame(animate);
        controls.update();
        renderer.render(scene, camera);
    }

    function downloadSTL() {
        if (!keychainGroup) {
            alert("Model henüz yüklenmedi!");
            return;
        }

        const exporter = new THREE.STLExporter();
        const result = exporter.parse(keychainGroup, { binary: true });

        const blob = new Blob([result], { type: 'application/octet-stream' });
        const link = document.createElement('a');
        link.href = URL.createObjectURL(blob);
        link.download = `${activeMode === 'preset' ? document.getElementById('logoSelect').value : 'ozel_logo'}_anahtarlik.stl`;
        link.click();
    }

    window.onload = init3D;
</script>

</body>
</html>
